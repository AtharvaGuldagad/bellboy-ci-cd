_format_version: "3.0"
services:
  - name: steward-service
    # throws the ball to Steward running on the host machine
    url: http://host.docker.internal:8080
    routes:
      - name: webhook-route
        paths:
          - /api/v1/webhook
    plugins:
      - name: rate-limiting
        config:
          # DDOS limits: Max 10 webhook triggers per minute per IP
          minute: 10
          policy: local
          fault_tolerant: true
          hide_client_headers: false