global:
  scrape_interval: 5s # High resolution for our load test

scrape_configs:
  - job_name: 'steward-control-plane'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8080']

  - job_name: 'bellhop-data-plane'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8081']